name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run application tests
        run: npm test

      - name: Restore desktop Google login settings
        shell: pwsh
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_JSON)) {
            throw 'The GOOGLE_OAUTH_JSON repository secret is required.'
          }
          $path = Join-Path $PWD 'electron/google-oauth.json'
          $bytes = [System.Convert]::FromBase64String($env:GOOGLE_OAUTH_JSON)
          [System.IO.File]::WriteAllBytes($path, $bytes)

      # 1.1.N (N = 실행 번호): 실행할 때마다 올라가고, 기존 1.0.x보다 항상 높아서 자동 업데이트가 새 버전으로 인식함
      - name: Set installer version
        shell: pwsh
        run: npm version "1.1.$env:GITHUB_RUN_NUMBER" --no-git-tag-version

      - name: Build Windows installer
        run: npm run electron:build

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "1.1.$env:GITHUB_RUN_NUMBER"
          $tag = "v$version"
          # latest.yml: 설치된 앱이 새 버전을 확인할 때 읽는 파일 / blockmap: 바뀐 부분만 받기
          $files = @(
            (Join-Path 'release' "Planer-Setup-$version.exe"),
            (Join-Path 'release' "Planer-Setup-$version.exe.blockmap"),
            (Join-Path 'release' 'latest.yml')
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Release file not found: $file" }
          }
          if (-not (Select-String -LiteralPath (Join-Path 'release' 'latest.yml') -SimpleMatch "Planer-Setup-$version.exe" -Quiet)) {
            throw 'latest.yml does not point to the new installer'
          }
          gh release create $tag @files --target $env:GITHUB_SHA --title "Planer $version" --generate-notes
