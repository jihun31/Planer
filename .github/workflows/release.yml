name: Windows installer

# main에 병합될 때 앱 파일이 바뀌었으면 자동으로 설치본을 만들어 릴리스 (설치된 앱은 자동 업데이트)
# 봇(bot/)·문서만 바뀐 경우에는 실행하지 않음. 필요하면 Run workflow로 직접 실행
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

# 한 번에 하나씩. 빌드 중에 병합이 여러 번 되면 가장 마지막 것만 이어서 빌드 (진행 중인 빌드는 끊지 않음)
concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  # lint·단위·화면·Firestore 규칙·봇 테스트를 모두 통과해야 릴리스한다 (check.yml)
  checks:
    uses: ./.github/workflows/check.yml

  release:
    needs: checks
    runs-on: windows-latest
    steps:
      # 버전이 커밋 수로 정해지므로 전체 기록이 필요하다
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore desktop Google login settings
        shell: pwsh
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_JSON)) {
            throw 'The GOOGLE_OAUTH_JSON repository secret is required.'
          }
          $path = Join-Path $PWD 'electron/google-oauth.json'
          $bytes = [System.Convert]::FromBase64String($env:GOOGLE_OAUTH_JSON)
          [System.IO.File]::WriteAllBytes($path, $bytes)

      # 버전 = package.json 앞 두 자리 + 커밋 수 (scripts/app-version.mjs). 로컬 install:local과 같은 규칙이라
      # 같은 커밋이면 로컬 설치본과 릴리스 버전이 같다. 커밋마다 올라가서 자동 업데이트가 새 버전으로 인식한다.
      # 같은 커밋을 다시 실행해 그 버전의 릴리스가 이미 있으면 빌드하지 않고 끝낸다.
      - name: Set installer version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node scripts/app-version.mjs
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw 'Could not compute the app version' }
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::notice::Release v$version already exists for this commit count; skipping."
            "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $global:LASTEXITCODE = 0
          npm version $version --no-git-tag-version
          "version=$version" >> $env:GITHUB_OUTPUT
          "skip=false" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        if: steps.version.outputs.skip != 'true'
        run: npm run electron:build

      # 태그·package.json·latest.yml·설치 파일·빌드된 앱 버전이 모두 같은지 확인 (다르면 릴리스하지 않음)
      - name: Verify release version
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/check-version.mjs --release-dir release --expect $env:VERSION

      - name: Publish GitHub Release
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:VERSION
          $tag = "v$version"
          # latest.yml: 설치된 앱이 새 버전을 확인할 때 읽는 파일 / blockmap: 바뀐 부분만 받기
          $files = @(
            (Join-Path 'release' "Planner-Setup-$version.exe"),
            (Join-Path 'release' "Planner-Setup-$version.exe.blockmap"),
            (Join-Path 'release' 'latest.yml')
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Release file not found: $file" }
          }
          if (-not (Select-String -LiteralPath (Join-Path 'release' 'latest.yml') -SimpleMatch "Planner-Setup-$version.exe" -Quiet)) {
            throw 'latest.yml does not point to the new installer'
          }
          gh release create $tag @files --target $env:GITHUB_SHA --title "Planner $version" --generate-notes
